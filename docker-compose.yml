services:
  wechat-selkies:
    image: ghcr.io/nickrunning/wechat-selkies:0.0.12-minimal
    platform: linux/arm64
    container_name: wechat-selkies
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    shm_size: "${SHM_SIZE:-1gb}"
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-3001}:3001"
    volumes:
      - ./config:/config
      - ./tools/wechat-decrypt:/opt/wechat-decrypt:ro
      - ./agent_console/wechat_controller.py:/opt/wechat-controller/wechat_controller.py:ro
      - ./runtime/wechat-decrypt:/runtime/wechat-decrypt
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Asia/Shanghai}
      - LC_ALL=${LC_ALL:-zh_CN.UTF-8}
      - AUTO_START_WECHAT=${AUTO_START_WECHAT:-true}
      - AUTO_START_QQ=${AUTO_START_QQ:-false}
      - CUSTOM_USER=${CUSTOM_USER:-}
      - PASSWORD=${PASSWORD}

  wechat-memory-sync:
    image: local/wechat-memory-suite:latest
    build:
      context: .
    container_name: wechat-memory-sync
    restart: unless-stopped
    depends_on:
      - wechat-selkies
    volumes:
      - ./config:/app/config:ro
      - ./runtime:/app/runtime
    command:
      - python
      - memory/sync_worker.py
      - --interval
      - "${MEMORY_SYNC_INTERVAL:-5}"
      - --source-db-dir
      - /app/config/xwechat_files/wxid_llnfi4jtg5hi12_235e/db_storage
      - --decrypted-dir
      - /app/runtime/wechat-decrypt/decrypted
      - --keys-file
      - /app/runtime/wechat-decrypt/keys/all_keys.json
      - --decrypt-state-file
      - /app/runtime/wechat-decrypt/sync_state.json
      - --memory-db
      - /app/runtime/memory/wechat_memory.sqlite
      - --status-file
      - /app/runtime/memory/sync_status.json
      - --wechat-base-dir
      - /app/config/xwechat_files/wxid_llnfi4jtg5hi12_235e
      - --runtime-dir
      - /app/runtime
      - --media-dir
      - /app/runtime/media
      - --config-file
      - /app/runtime/wechat-decrypt/config.json

  wechat-ai-memory:
    image: local/wechat-memory-suite:latest
    container_name: wechat-ai-memory
    restart: unless-stopped
    depends_on:
      - wechat-memory-sync
    ports:
      - "${AI_MEMORY_BIND:-127.0.0.1}:${AI_MEMORY_PORT:-8090}:8090"
    volumes:
      - ./runtime:/app/runtime
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - python
      - ai/app.py
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --index-interval
      - "${AI_MEMORY_INTERVAL:-5}"
      - --source-memory-db
      - /app/runtime/memory/wechat_memory.sqlite
      - --ai-db
      - /app/runtime/ai-memory/ai_memory.sqlite
      - --status-file
      - /app/runtime/ai-memory/ai_status.json

  wechat-agent-console:
    image: local/wechat-memory-suite:latest
    container_name: wechat-agent-console
    restart: unless-stopped
    depends_on:
      - wechat-ai-memory
    ports:
      - "${AGENT_CONSOLE_BIND:-127.0.0.1}:${AGENT_CONSOLE_PORT:-8078}:8078"
    volumes:
      - ./runtime:/app/runtime
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - python
      - agent_console/app.py
      - --host
      - 0.0.0.0
      - --port
      - "8078"
